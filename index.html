<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Duel | Elite Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        
        <section id="menu-screen" class="screen active">
            <h1>POKÉMON DUEL</h1>
            <p class="subtitle">Enter the Ultimate Battle Arena</p>
            <div class="menu-options">
                <button class="btn btn-primary" onclick="game.startSelection('pvp')">⚔️ Local PvP</button>
                <button class="btn btn-secondary" onclick="game.startSelection('pve')">🤖 Vs CPU</button>
                <button class="btn btn-primary" style="background: linear-gradient(135deg, #FF4B2B, #FF416C); color: #fff;" onclick="multiplayer.init()">🌐 Online Duel</button>
            </div>
            <div class="menu-extras glass" style="margin-top: 2rem; padding: 1rem; display: flex; gap: 1rem;">
                <select id="difficulty-select" class="btn-mini" onchange="game.difficulty = this.value" style="background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: #fff;">
                    <option value="easy">Easy AI</option>
                    <option value="medium" selected>Medium AI</option>
                    <option value="hard">Hard AI</option>
                </select>
                <button class="btn-mini" onclick="ui.showStats()">📊 Stats</button>
                <button class="btn-mini" id="last-replay-btn" style="display: none;" onclick="game.startReplay()">🎥 Last Replay</button>
            </div>
        </section>

        <section id="selection-screen" class="screen">
            <h1>Select Your Duelists</h1>
            <p class="subtitle" id="selection-status">Choose your Pokémon to begin</p>
            
            <div class="selection-container">
                <div class="player-card glass">
                    <h2>Player 1</h2>
                    <div class="search-container">
                        <input type="text" id="p1-search" placeholder="Search Pokemon..." onkeyup="ui.handleSearch(event, 1)">
                        <div id="p1-autocomplete" class="autocomplete-items"></div>
                    </div>
                    <div class="team-container" id="p1-team">
                        <div class="team-slot active" onclick="game.selectSlot(1, 0)" id="p1-slot-0"></div>
                        <div class="team-slot" onclick="game.selectSlot(1, 1)" id="p1-slot-1"></div>
                        <div class="team-slot" onclick="game.selectSlot(1, 2)" id="p1-slot-2"></div>
                    </div>
                    <div class="pokemon-details-preview" id="p1-preview">
                        <p class="text-muted">Select a slot & search</p>
                    </div>
                    <div class="ready-status" id="p1-ready-status">Not Ready</div>
                </div>

                <div class="vs-divider glass">
                    <h2 class="vs-text">VS</h2>
                </div>

                <div class="player-card glass">
                    <h2 id="p2-label">Player 2</h2>
                    <div class="search-container" id="p2-search-container">
                        <input type="text" id="p2-search" placeholder="Search Pokemon..." onkeyup="ui.handleSearch(event, 2)">
                        <div id="p2-autocomplete" class="autocomplete-items"></div>
                    </div>
                    <div class="team-container" id="p2-team">
                        <div class="team-slot active" onclick="game.selectSlot(2, 0)" id="p2-slot-0"></div>
                        <div class="team-slot" onclick="game.selectSlot(2, 1)" id="p2-slot-1"></div>
                        <div class="team-slot" onclick="game.selectSlot(2, 2)" id="p2-slot-2"></div>
                    </div>
                    <div class="pokemon-details-preview" id="p2-preview">
                        <p class="text-muted">Wait for search...</p>
                    </div>
                    <div class="ready-status" id="p2-ready-status">Not Ready</div>
                </div>
            </div>

            <div class="battleground-selector glass" style="margin-top: 2rem; padding: 1.5rem; width: 100%; text-align: center;">
                <h3>Select Battleground</h3>
                <div class="battlefield-btns" style="display: flex; gap: 1rem; justify-content: center; margin-top: 1rem;">
                    <button class="btn-mini" onclick="game.selectBattleground('forest')">🌲 Forest</button>
                    <button class="btn-mini" onclick="game.selectBattleground('rock')">🪨 Rock</button>
                    <button class="btn-mini" onclick="game.selectBattleground('water')">🌊 Water</button>
                    <button class="btn-mini" onclick="game.selectBattleground('stadium')">🏟️ Arena</button>
                </div>
            </div>

            <button id="start-battle-btn" class="btn btn-primary" style="margin-top: 2rem; display: none;" onclick="game.initBattle()">START DUEL ⚔️</button>
        </section>

        <section id="battle-screen" class="screen">
            <div class="battle-arena-container" id="arena-main">
                <div class="battle-overlay"></div>
                
                <div class="player-area player-2-area" id="p2-area">
                    <div class="hp-info glass" style="padding: 0.5rem 1rem; margin-bottom: 1rem;">
                        <h3 id="p2-battle-name" style="font-size: 1rem; text-transform: uppercase;"></h3>
                        <div class="hp-bar-container">
                            <div class="hp-bar-fill" id="p2-hp-fill"></div>
                        </div>
                        <div class="hp-text" id="p2-hp-text"></div>
                    </div>
                    <div class="pokemon-sprite-container">
                        <img src="" alt="p2" class="pokemon-sprite" id="p2-sprite">
                    </div>
                </div>

                <div class="player-area player-1-area" id="p1-area">
                    <div class="hp-info glass" style="padding: 0.5rem 1rem; margin-bottom: 1rem;">
                        <h3 id="p1-battle-name" style="font-size: 1rem; text-transform: uppercase;"></h3>
                        <div class="hp-bar-container">
                            <div class="hp-bar-fill" id="p1-hp-fill"></div>
                        </div>
                        <div class="hp-text" id="p1-hp-text"></div>
                    </div>
                    <div class="pokemon-sprite-container">
                        <img src="" alt="p1" class="pokemon-sprite" id="p1-sprite">
                    </div>
                </div>
            </div>

            <div class="battle-ui-bottom">
                <div class="battle-log glass" id="battle-log">
                    <p>> Welcome to the Arena!</p>
                </div>
                <div class="action-menu glass" id="move-container">
                    <p class="text-muted" style="grid-column: span 2; text-align: center;">Wait for turn...</p>
                </div>
            </div>
        </section>

        <section id="end-screen" class="screen">
            <h1 id="winner-text"></h1>
            <p class="subtitle">The duel has concluded.</p>
            <div style="display: flex; gap: 1rem;">
                <button class="btn btn-primary" onclick="game.reset()">Play Again</button>
                <button class="btn btn-secondary" onclick="game.startReplay()">Watch Replay 🎥</button>
            </div>
        </section>

        <section id="stats-screen" class="screen">
            <h1>YOUR CAREER</h1>
            <div class="stats-grid glass" id="stats-container">
                <!-- Filled via JS -->
            </div>
            <button class="btn btn-primary" style="margin-top: 2rem;" onclick="ui.showScreen('menu-screen')">Back to Menu</button>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
